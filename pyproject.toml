[project]
name = "agentic-rag"
version = "0.1.0"
description = "Local multimodal agentic RAG: LangGraph, Qdrant hybrid search, reranking, vLLM/MLX/Ollama, Langfuse and RAGAS."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Roman Shevchenko" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "qdrant-client>=1.15",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "huggingface-hub>=0.34",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "langfuse>=3.0",
    "pillow>=10.4",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5",
    "transformers>=4.53",
    "sentence-transformers>=4.0",
    "FlagEmbedding>=1.3",
    "fastembed>=0.6",
    "colpali-engine>=0.3.10",
]
ingest = ["docling>=2.40"]
eval = ["ragas>=0.4", "langchain-community==0.4"]
ui = ["gradio>=5.0"]
mlx = [
    "mlx-lm>=0.26; sys_platform == 'darwin'",
    "mlx-vlm>=0.3; sys_platform == 'darwin'",
]
all = ["agentic-rag[ml,ingest,eval,ui]"]

[project.scripts]
rag = "agentic_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    "testcontainers[qdrant]>=4.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "PT"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src", "tests", "eval"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: requires Docker (Qdrant via testcontainers)"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
